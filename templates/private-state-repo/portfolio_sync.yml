name: Portfolio Sync

on:
  schedule:
    # Run at 10:00 UTC and 22:00 UTC (= 3:00 AM and 3:00 PM PDT / UTC-7)
    - cron: '0 10,22 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private state repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: state
          ref: main

      - name: Checkout public code repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: <PUBLIC_REPO_OWNER>/<PUBLIC_REPO_NAME>
          ref: main
          path: code

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: code
        run: pip install -r requirements.txt

      - name: Install SOPS
        env:
          SOPS_VERSION: 3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" \
            --output /tmp/sops
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum --check --strict
          sudo install --mode 0755 /tmp/sops /usr/local/bin/sops

      - name: Configure state commits
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync portfolio data (refresh tokens + snapshot value)
        id: sync
        working-directory: code
        env:
          REBALANCER_STATE_DIR: ${{ github.workspace }}/state
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: python main.py --sync

      - name: Publish remaining encrypted state
        id: publish
        if: always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
        working-directory: code
        env:
          REBALANCER_STATE_DIR: ${{ github.workspace }}/state
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: python -m src.state_sync

      - name: Alert on prolonged failure (>48h)
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const current = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            let firstFailure = Date.parse(current.data.run_started_at);
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'portfolio_sync.yml', branch: 'main', status: 'completed', per_page: 100
            });
            history: for await (const page of pages) {
              for (const run of page.data) {
                if (run.run_number >= current.data.run_number) continue;
                if (run.conclusion !== 'failure') break history;
                firstFailure = Math.min(firstFailure, Date.parse(run.run_started_at));
                if (Date.now() - firstFailure > 48 * 3600000) break history;
              }
            }
            if (Date.now() - firstFailure <= 48 * 3600000) return;
            const operation = '${{ steps.publish.outcome }}' === 'failure' ? 'publishing encrypted state'
              : '${{ steps.sync.outcome }}' === 'failure' ? 'running portfolio sync' : 'workflow setup';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'token-refresh',
              state: 'open',
            });

            if (issues.data.length > 0) {
              console.log('Open token-refresh issue already exists. Skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Portfolio sync has failed for more than 48 hours',
              body: `Portfolio sync has been failing since ${new Date(firstFailure).toISOString()}. The latest run failed during ${operation}.\n\n[Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'token-refresh']
            });

      - name: Auto-close token alert on recovery
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'token-refresh',
              state: 'open',
            });

            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Portfolio sync recovered successfully. Auto-closing.`,
              });
              console.log(`Closed token-refresh issue #${issue.number}`);
            }

      - name: Alert on high drift (accuracy ≤ 95%)
        if: success() && steps.sync.outputs.accuracy != '' && steps.sync.outputs.accuracy <= 95
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const accuracy = '${{ steps.sync.outputs.accuracy }}';

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'rebalance-needed',
              state: 'open',
            });

            if (issues.data.length > 0) {
              console.log('Open rebalance-needed issue already exists. Skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Portfolio drift detected — accuracy ${accuracy}%`,
              body: `Portfolio accuracy has dropped to **${accuracy}%** (threshold: 95%).\n\nConsider running the rebalancer to review and execute recommended trades.\n\n[Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['rebalance-needed']
            });

      - name: Auto-close drift alert on recovery (accuracy > 95%)
        if: success() && steps.sync.outputs.accuracy != '' && steps.sync.outputs.accuracy > 95
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'rebalance-needed',
              state: 'open',
            });

            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Portfolio accuracy recovered to **${{ steps.sync.outputs.accuracy }}%**. Auto-closing.`,
              });
              console.log(`Closed issue #${issue.number}`);
            }
